<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="USJナビ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>USJナビ</title>
<style>
:root {
  --bg: #ffffff; --fg: #0b0b0b; --muted: #444a52; --card: #f2f4f7; --line: #b9c0ca;
  --accent: #0040c8; --accent-fg: #ffffff; --warn: #b3001b; --warn-bg: #ffe8ec;
  --ok: #0a6e2e; --pass: #6a2bbf; --hl: #fff1b8; --hl-fg: #3d2f00;
  --alarm: #d4000f; --alarm-fg: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --fg: #f6f6f6; --muted: #b9bec6; --card: #15181d; --line: #3b414b;
    --accent: #5c9dff; --accent-fg: #000000; --warn: #ff6b80; --warn-bg: #3b0d16;
    --ok: #4bd27b; --pass: #c39bff; --hl: #3b3210; --hl-fg: #ffe38a;
    --alarm: #ff3344; --alarm-fg: #000000;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  font-size: 18px; line-height: 1.5;
}
.wrap { max-width: 480px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); }

/* いちばん上：日付と時刻（小さく1行） */
#top { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; justify-content: space-between; }
#clock b { font-size: 18px; font-weight: 800; }
#fresh { font-size: 12px; color: var(--muted); }
#fresh.old { font-size: 14px; color: var(--warn); font-weight: 800; }
#trial { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px;
  font-size: 12px; color: var(--hl-fg); background: var(--hl); border-radius: 8px; padding: 0 4px 0 10px; }
#trial:empty { display: none; }
#trial button { min-height: 34px; border: 0; background: transparent; color: var(--accent); font-weight: 800; font-size: 12px; text-decoration: underline; }

/* 出発が近いときの赤い帯 */
.fixbar { margin-top: 8px; padding: 10px 14px; border-radius: 16px; border: 2.5px solid var(--warn); }
.fixbar .fb1 { display: flex; align-items: baseline; gap: 8px; }
.fixbar .fbt { font-size: 24px; font-weight: 900; color: var(--warn); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fixbar .fbn { flex: 1; min-width: 0; font-size: 19px; font-weight: 800; }
.fixbar .fbl { font-size: 15px; font-weight: 800; white-space: nowrap; }
.fixbar .fb2 { font-size: 15px; font-weight: 700; color: var(--muted); }
.fixbar .fb3 { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; align-items: center; }
.fixbar .fb3 i { font-style: normal; font-size: 12px; font-weight: 800; color: var(--muted); margin-right: 2px; }
.fixbar .fb3 span { font-size: 13px; font-weight: 700; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; white-space: nowrap; }
.fixbar.hot { background: var(--alarm); border-color: var(--alarm); color: var(--alarm-fg); }
.fixbar.hot .fbt, .fixbar.hot .fb2, .fixbar.hot .fb3 i { color: var(--alarm-fg); }
.fixbar.hot .fb2 { font-size: 18px; font-weight: 900; }
.fixbar.hot .fb3 span { border-color: var(--alarm-fg); }
.link { display: inline-block; min-height: 44px; border: 0; background: transparent; color: var(--accent); font-size: 15px; font-weight: 800; padding: 0; }

/* いま（主役） */
.card { background: var(--card); border-radius: 22px; padding: 18px 18px 8px; margin-top: 12px; }
#now .lead { margin: 0; font-size: 14px; font-weight: 800; color: var(--accent); letter-spacing: .08em; }
#now h2 { margin: 2px 0 6px; font-size: 30px; font-weight: 800; line-height: 1.25; word-break: break-word; }
#now .facts { margin: 0; font-size: 18px; font-weight: 700; }
#now .facts b { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
#now .dot { color: var(--muted); margin: 0 2px; }
#now .why { margin: 6px 0 0; font-size: 15px; color: var(--muted); line-height: 1.45; }
#now .why.hot { color: var(--warn); font-size: 20px; font-weight: 900; }
#now .risk { margin: 6px 0 0; font-size: 15px; font-weight: 800; color: var(--warn); }
#now .link { display: block; margin: 2px auto 0; }
#now .alts { list-style: none; margin: 0 0 10px; padding: 0; }
#now .alts li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
#now .alts .an { flex: 1; min-width: 0; font-size: 17px; font-weight: 800; }
#now .alts small { display: block; font-size: 13px; font-weight: 600; color: var(--muted); }
#now .alts button { min-height: 44px; border-radius: 12px; border: 2px solid var(--accent); background: var(--bg); color: var(--accent); font-size: 15px; font-weight: 800; padding: 0 12px; white-space: nowrap; }
.big { display: block; width: 100%; min-height: 64px; margin-top: 14px; border: 0; border-radius: 16px;
  background: var(--accent); color: var(--accent-fg); font-size: 24px; font-weight: 800; }
.big:active { transform: scale(.98); }
.tag { display: inline-block; font-size: 13px; font-weight: 700; border: 1.5px solid currentColor; border-radius: 6px; padding: 0 6px; margin: 0 6px; vertical-align: 3px; letter-spacing: 0; }
.tag.pass { color: var(--pass); margin-left: 0; } .tag.fixed { color: var(--warn); } .tag.ok { color: var(--ok); }

/* このあと：乗り換え案内のような予定表 */
#plan h3 { margin: 22px 0 6px; font-size: 14px; font-weight: 800; color: var(--muted); letter-spacing: .08em; }
.tl2 { list-style: none; margin: 0; padding: 0; }
.tl2 li { display: flex; align-items: baseline; gap: 12px; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 17px; }
.tl2 time { flex: 0 0 3.2em; font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
.tl2 span { flex: 1; min-width: 0; }
.tl2 em { font-style: normal; font-size: 14px; color: var(--muted); white-space: nowrap; }
.tl2 li.fx { font-weight: 700; }
.tl2 li.fx em { color: var(--warn); font-size: 16px; font-weight: 900; }
.tl2 li.free span, .tl2 li.free time { color: var(--muted); font-weight: 600; font-size: 15px; }
.tl2 li.end { border-bottom: 0; color: var(--muted); }
#plan .verdict { margin: 10px 0 0; font-size: 16px; font-weight: 800; }
#plan .verdict.good { color: var(--ok); }
#plan .verdict.bad { color: var(--warn); }
#plan .note { margin: 4px 0 0; }

/* 時間指定の確認 */
.ask { background: var(--warn-bg); border: 2px solid var(--warn); border-radius: 14px; padding: 12px; margin-top: 12px; }
.ask p { margin: 0 0 8px; font-weight: 700; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); font-weight: 700; padding: 6px 10px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.small { min-height: 44px; font-size: 15px; padding: 4px 10px; }

/* 折りたたみ */
details { margin-top: 10px; border: 1.5px solid var(--line); border-radius: 14px; }
summary { list-style: none; padding: 12px 16px; font-weight: 700; font-size: 17px; min-height: 50px; display: flex; justify-content: space-between; align-items: center; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "＋"; color: var(--muted); }
details[open] summary::after { content: "－"; }
details > div { padding: 0 14px 14px; }
.item { padding: 10px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .n { font-weight: 700; }
.item .m { font-size: 15px; color: var(--muted); }
.item .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.item.dim .n { text-decoration: line-through; opacity: .6; }
.tl { display: grid; grid-template-columns: 7.2em 1fr; gap: 2px 8px; font-size: 16px; }
.tl .t { font-variant-numeric: tabular-nums; color: var(--muted); }
.tl .free { color: var(--muted); }
.hl { background: var(--hl); color: var(--hl-fg); border-radius: 6px; padding: 0 4px; }
.warnText { color: var(--warn); font-weight: 700; }
.set { display: grid; gap: 12px; }
.set label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.set input, .set select { font: inherit; font-size: 18px; min-height: 44px; padding: 4px 8px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--fg); }
.set input[type=number] { width: 5em; }
.set input[type=checkbox] { width: 28px; height: 28px; min-height: 0; }
.set h4 { margin: 8px 0 0; font-size: 16px; }
.note { font-size: 15px; color: var(--muted); }
ul.rules { padding-left: 1.2em; margin: 0; }
ul.rules li { margin: 6px 0; }

footer { margin-top: 20px; text-align: center; font-size: 15px; color: var(--muted); }
footer a { font-weight: 700; }

/* そろそろ移動（画面いっぱい） */
#alarm { position: fixed; inset: 0; z-index: 10; background: var(--alarm); color: var(--alarm-fg);
  display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 24px; }
#alarm[hidden] { display: none; }
#alarm .h { font-size: 44px; font-weight: 900; }
#alarm .d { font-size: 24px; font-weight: 700; margin: 12px 0 28px; }
#alarm button { min-height: 72px; min-width: 70%; border-radius: 18px; border: 0; font-size: 26px; font-weight: 900; background: var(--alarm-fg); color: var(--alarm); }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 9;
  background: var(--fg); color: var(--bg); border-radius: 14px; padding: 8px 8px 8px 16px; display: flex; gap: 12px; align-items: center;
  width: min(440px, calc(100% - 32px)); font-size: 16px; }
#toast[hidden] { display: none; }
#toast button { background: var(--bg); color: var(--fg); border: 0; border-radius: 10px; min-height: 44px; padding: 0 14px; font-weight: 800; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <header id="top">
    <span id="clock"></span>
    <span id="fresh"></span>
  </header>
  <div id="trial"></div>
  <div id="alert"></div>
  <div id="overdue"></div>

  <section id="now" class="card" aria-live="polite"></section>
  <section id="plan"></section>

  <details id="dList"><summary>待ち時間を見る・直す</summary><div id="list"></div></details>
  <details id="dNotify"><summary>お知らせ・カレンダー</summary><div id="notify"></div></details>
  <details id="dRules"><summary>決め方のルール</summary><div id="rules"></div></details>
  <details id="dSet"><summary>設定</summary><div id="settings"></div></details>

  <footer>
    <a href="https://queue-times.com/" target="_blank" rel="noopener">Powered by Queue-Times.com</a>
    <div id="src" class="note"></div>
  </footer>
</div>

<div id="alarm" hidden role="alertdialog" aria-live="assertive">
  <div class="h">そろそろ移動</div>
  <div class="d" id="alarmText"></div>
  <button id="alarmOk">OK</button>
</div>
<div id="toast" hidden><span id="toastText"></span><button id="toastUndo">取り消す</button></div>

<script>
'use strict';

/* ============ 予定データ ============ */
const DAYS = {
  d4: { key: 'd4', date: '2026-11-04', label: '11/4（水）', start: '15:00', end: '20:00', endText: '20:00 退園 → シティウォークの551へ', startArea: 'ハリウッド' },
  d5: { key: 'd5', date: '2026-11-05', label: '11/5（木）', start: '07:15', open: '07:45', end: '21:30', endText: '21:30 出口へ（ホテル門限23時）', startArea: 'ハリウッド' },
};
// type: fixed=時間指定 / pass=エクスプレス / standby=スタンバイ / event=イベント / meal=食事 / rest=休憩
// area が null のもの（食事・休憩など）は「近くで済ませる」扱い（移動は同じエリアの時間）
const ITEMS = [
  { id: 'sadako',  name: '貞子', days: ['d4'], type: 'pass', dur: 15, est: 10, pri: 3, qt: 12324, area: 'ハリウッド' },
  { id: 'bio',     name: 'バイオハザード レクイエム', short: 'バイオハザード', days: ['d4'], type: 'fixed', time: '16:10', dur: 30, area: 'ハリウッド' },
  { id: 'hdr',     name: 'ハリウッド・ドリーム・ザ・ライド', chip: 'ハリドリ', days: ['d4'], type: 'pass', dur: 10, est: 10, pri: 3, qt: 7077, area: 'ハリウッド' },
  { id: 'dinner4', name: '夕食（軽め）', days: ['d4'], type: 'meal', after: '17:00', by: '18:30', dur: 30, pri: 3, area: null },
  { id: 'zombie4', name: 'ゾンビ・デ・ダンス', chip: 'ゾンビ', days: ['d4'], type: 'event', after: '18:00', dur: 30, pri: 2, area: null },
  { id: 'jpdark',  name: 'ジュラシック・パーク イン・ザ・ダーク', short: 'ジュラシック（ダーク）', chip: 'ジュラシック', days: ['d4'], type: 'fixed', time: '18:50', dur: 30, qt: 15322, area: 'ジュラシック・パーク' },
  { id: 'backdrop', name: 'ハリドリ ～バックドロップ～', chip: 'バックドロップ', first: 'd5', firstWait: 20, days: ['d4', 'd5'], type: 'standby', dur: 10, est: 90, pri: 3, qt: 12070, area: 'ハリウッド' },
  { id: 'minion',  name: 'ミニオン・ハチャメチャ・ライド', chip: 'ミニオン', days: ['d4', 'd5'], type: 'standby', dur: 10, est: 60, pri: 3, qt: 12066, area: 'ミニオン・パーク' },
  { id: 'conan',   name: '名探偵コナン 4-D', chip: 'コナン', days: ['d4', 'd5'], type: 'standby', after: '09:00', dur: 30, est: 30, pri: 3, qt: 13005, area: 'ハリウッド' },
  { id: 'hp',      name: 'ハリー・ポッター', days: ['d5'], type: 'fixed', time: '11:00', dur: 30, qt: 12065, area: 'ハリー・ポッター' },
  { id: 'lunch',   name: '昼食', days: ['d5'], type: 'meal', after: '11:00', by: '14:00', dur: 45, pri: 3, area: null },
  { id: 'fd',      name: 'ザ・フライング・ダイナソー', short: 'フライング・ダイナソー', chip: 'フライング', days: ['d5'], type: 'fixed', time: '12:30', dur: 20, qt: 7092, area: 'ジュラシック・パーク' },
  { id: 'sing',    name: 'SING ON TOUR', chip: 'SING', days: ['d4', 'd5'], type: 'standby', after: '10:30', dur: 30, est: 20, pri: 2, qt: 7214, area: 'ハリウッド' },
  { id: 'mk',      name: 'マリオカート（ニンテンドー入場）', short: 'マリオカート', days: ['d5'], type: 'fixed', time: '15:30', dur: 30, qt: 12061, area: 'ニンテンドー' },
  { id: 'dk',      name: 'ドンキーコングのクレイジー・トロッコ', short: 'ドンキーコング', chip: 'ドンキー', days: ['d5'], type: 'fixed', time: '16:00', dur: 20, qt: 14402, area: 'ニンテンドー' },
  { id: 'photo',   name: '写真・グッズ・USJ土産', chip: '写真・グッズ', days: ['d5'], type: 'rest', after: '12:00', dur: 45, pri: 2, area: null },
  { id: 'dinner5', name: '夕食', days: ['d5'], type: 'meal', after: '16:30', by: '19:30', dur: 40, pri: 3, area: null },
  { id: 'mi',      name: 'ミッション・インポッシブル', chip: 'ミッション', days: ['d5'], type: 'fixed', time: '18:00', dur: 30, area: 'ニューヨーク' },
  { id: 'zombie5', name: 'ゾンビ（ハロウィーン・ナイト）', chip: 'ゾンビ', days: ['d5'], type: 'event', after: '18:00', dur: 30, pri: 2, area: null },
  { id: 'csm',     name: 'チェンソーマン 4-D', chip: 'チェンソーマン', days: ['d4', 'd5'], type: 'standby', after: '09:00', dur: 25, est: 40, pri: 2, qt: 13925, area: 'ハリウッド' },
  { id: 'factory', name: 'ファクトリー', days: ['d5'], type: 'standby', after: '10:00', dur: 20, est: 40, pri: 1, qt: 17893, area: 'ハリウッド' },
];
const TYPE_LABEL = { fixed: '時間指定', pass: 'パス', standby: 'スタンバイ', event: 'イベント', meal: '食事', rest: '休憩' };
const PRI_LABEL = { 3: '高', 2: '中', 1: '低' };
const QT_URL = 'https://queue-times.com/parks/284/queue_times.json';
// アプリを直したらこの番号を変える（開いているスマホが自動で新しい版に切り替わる）
const APP_VERSION = '2026-10-12a';

/* ============ 保存（localStorage は必ず try/catch） ============ */
const K = { settings: 'usjnavi.settings', state: 'usjnavi.state', trial: 'usjnavi.trialState', data: 'usjnavi.lastData', fired: 'usjnavi.fired', notify: 'usjnavi.notify' };
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const DEFAULT_SETTINGS = { day: 'auto', fixTime: '', same: 3, diff: 10, tired: false, times: {}, trialLive: false, pace: 1, gap: 5 };
let S = Object.assign({}, DEFAULT_SETTINGS, LS.get(K.settings, {}));
S.times = S.times || {};
const saveS = () => LS.set(K.settings, S);
const blankState = () => ({ status: {}, at: {}, paused: {}, overrides: {}, area: {}, chosen: null });
function loadState(trial) { return Object.assign(blankState(), LS.get(trial ? K.trial : K.state, {})); }
function saveState(trial, st) { LS.set(trial ? K.trial : K.state, st); }

/* ============ 時刻（端末の設定に関係なく日本時間で計算） ============ */
const toMin = (hm) => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };
const pad = (n) => String(n).padStart(2, '0');
const fmt = (min) => { const m = Math.round(min); return `${Math.floor(m / 60)}:${pad(((m % 60) + 60) % 60)}`; };
const dur = (min) => { const m = Math.max(0, Math.round(min)); return m >= 60 ? `${Math.floor(m / 60)}時間${m % 60 ? (m % 60) + '分' : ''}` : `${m}分`; };
function jstNow() {
  const d = new Date(Date.now() + 9 * 3600e3);
  return { date: d.toISOString().slice(0, 10), min: d.getUTCHours() * 60 + d.getUTCMinutes() + d.getUTCSeconds() / 60 };
}
const jstHM = (ms) => { const d = new Date(ms + 9 * 3600e3); return `${d.getUTCHours()}:${pad(d.getUTCMinutes())}`; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const short = (i) => i.short || i.name;
const fixedTime = (i) => toMin(S.times[i.id] || i.time);
// エリア同士の歩く時間（分）。隣どうしだけ書き、離れたエリアは一番近い道順の合計で計算する。
// 出典: usjhack.com「USJエリア最新版まとめ」の入口からの所要時間と隣接関係をもとにした目安
const WALK = [
  ['ハリウッド', 'ニューヨーク', 4], ['ニューヨーク', 'ミニオン・パーク', 3], ['ミニオン・パーク', 'サンフランシスコ', 2],
  ['サンフランシスコ', 'ジュラシック・パーク', 2], ['ジュラシック・パーク', 'アミティ', 2], ['アミティ', 'ハリー・ポッター', 3],
  ['ハリー・ポッター', 'ワンダーランド', 3], ['ワンダーランド', 'ハリウッド', 6], ['ワンダーランド', 'ニンテンドー', 4],
  ['ニンテンドー', 'ウォーターワールド', 2], ['ウォーターワールド', 'アミティ', 3],
];
const DIST = (() => {
  const d = {};
  const names = [...new Set(WALK.flatMap(([a, b]) => [a, b]))];
  for (const a of names) { d[a] = {}; for (const b of names) d[a][b] = a === b ? 0 : Infinity; }
  for (const [a, b, m] of WALK) { d[a][b] = m; d[b][a] = m; }
  for (const k of names) for (const a of names) for (const b of names) if (d[a][k] + d[k][b] < d[a][b]) d[a][b] = d[a][k] + d[k][b];
  return d;
})();
// 移動時間：同じエリア（または場所が決まっていないもの）は S.same 分。違うエリアは歩く時間×歩く速さ（最低 S.same 分）
function travel(a, b) {
  if (!a || !b || a === b) return +S.same;
  const m = DIST[a] && DIST[a][b];
  if (m == null || m === Infinity) return +S.diff;
  return Math.max(+S.same, Math.round(m * (+S.pace || 1)));
}

// 今どの日の、何時として表示するか
function getCtx() {
  const real = jstNow();
  let dayKey, trial = false;
  if (S.day === 'auto') {
    if (real.date === DAYS.d4.date) dayKey = 'd4';
    else if (real.date === DAYS.d5.date) dayKey = 'd5';
    else { dayKey = real.date > DAYS.d5.date ? 'd5' : 'd4'; trial = true; }
  } else {
    dayKey = S.day;
    if (real.date !== DAYS[dayKey].date) trial = true;
  }
  const day = DAYS[dayKey];
  let now;
  if (S.fixTime) { now = toMin(S.fixTime); trial = true; }
  else if (trial) now = S.trialLive ? Math.floor(real.min) : toMin(day.start); // 今の待ちで試すときは今の時刻で
  else now = Math.floor(real.min);
  return { real, day, dayKey, trial, now, arrive: toMin(day.start), start: toMin(day.open || day.start), end: toMin(day.end) };
}

/* ============ 待ち時間データ ============ */
let W = { rides: {}, updatedAt: 0, parkOpen: false, source: '' };
function normalize(json) {
  const list = [...(json.rides || []), ...(json.lands || []).flatMap((l) => l.rides || [])];
  const rides = {}; let up = 0;
  for (const r of list) {
    const lu = Date.parse(r.last_updated) || 0;
    rides[r.id] = { wait: r.wait_time, open: r.is_open, lu };
    if (lu > up) up = lu;
  }
  // 全部 false のときは開園前・閉園後とみなして「休止」判定に使わない
  return { rides, updatedAt: up, parkOpen: list.some((r) => r.is_open) };
}
async function getJSON(url, ms) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctl.signal, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}
// GitHub Pages は古いページを最大10分使い回すので、新しい版が出ていたら別アドレスで開き直す
async function checkUpdate() {
  try {
    const txt = await (await fetch('./index.html?t=' + Date.now(), { cache: 'no-store' })).text();
    const m = txt.match(/const APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
  } catch {}
}
async function refresh() {
  checkUpdate();
  let got = null, src = '';
  try { got = normalize(await getJSON(QT_URL, 6000)); src = 'Queue-Times 直接'; } catch {}
  if (!got || !Object.keys(got.rides).length) {
    try { got = normalize(await getJSON('./waits.json?t=' + Date.now(), 8000)); src = 'waits.json'; } catch { got = null; }
  }
  const cached = LS.get(K.data, null);
  if (got && Object.keys(got.rides).length) {
    if (cached && cached.updatedAt > got.updatedAt) W = Object.assign(cached, { source: '保存データ（こちらが新しい）' });
    else { W = Object.assign(got, { source: src }); LS.set(K.data, got); }
  } else if (cached) {
    W = Object.assign(cached, { source: '保存データ（電波なし？）' });
  } else {
    W = { rides: {}, updatedAt: 0, parkOpen: false, source: '取得できませんでした' };
  }
  render();
}

/* ============ 判断の材料 ============ */
function isPaused(i, st) {
  if (st.paused[i.id]) return 'manual';
  if (i.qt && W.parkOpen) { const r = W.rides[i.qt]; if (r && r.open === false) return 'auto'; }
  return false;
}
// 今の待ち時間。手入力は、それより新しい自動データが来るまで優先
// useEst：お試し表示では、当日らしい「目安の待ち」で計算する（夜や別の日の待ち時間は参考にならないため）
function waitOf(i, st, useEst) {
  if (i.type !== 'standby' && i.type !== 'pass') return { wait: 0, src: null };
  const o = st.overrides[i.id];
  const r = i.qt ? W.rides[i.qt] : null;
  if (o && (i.type === 'pass' || !r || !r.lu || o.at > r.lu)) return { wait: o.wait, src: '手入力' };
  if (i.type === 'pass') return { wait: i.est, src: 'パス' };
  if (!useEst && r && r.open !== false && typeof r.wait === 'number') return { wait: r.wait, src: '自動' };
  return { wait: i.est, src: '目安' };
}
// useEst（お試し・翌日の予測）のときは、目安の待ちで計算し、今の休止情報も使わない
function buildEnv(c, useEst = c.trial && !S.trialLive) {
  const st = loadState(c.trial);
  const items = ITEMS.filter((i) => i.days.includes(c.dayKey));
  const paused = new Map();
  const w = {};
  for (const i of items) {
    const p = useEst ? (st.paused[i.id] ? 'manual' : false) : isPaused(i, st);
    if (p) paused.set(i.id, p);
    w[i.id] = waitOf(i, st, useEst);
  }
  const age = W.updatedAt ? Math.max(0, (Date.now() - W.updatedAt) / 60000) : 120;
  const done = new Set(Object.keys(st.status));
  const chosen = st.chosen && !done.has(st.chosen) && items.some((i) => i.id === st.chosen) ? st.chosen : null;
  return { c, st, items, paused, w, age, useEst, done, chosen, area: st.area[c.dayKey] || c.day.startArea };
}

/* ============ 確率（待ち時間のぶれを見込んだ目安） ============ */
// 標準正規分布の累積確率
function phi(x) {
  const z = Math.abs(x) / Math.SQRT2, k = 1 / (1 + 0.3275911 * z);
  const erf = 1 - (((((1.061405429 * k - 1.453152027) * k) + 1.421413741) * k - 0.284496736) * k + 0.254829592) * k * Math.exp(-z * z);
  return x >= 0 ? (1 + erf) / 2 : (1 - erf) / 2;
}
// かかる時間のぶれ（分）。待ちが長いほど・データが古いほど大きい
function spread(i, wait, src, age) {
  let s;
  if (i.type === 'standby') s = src === '手入力' ? Math.max(3, wait * 0.2) : src === '目安' ? Math.max(8, wait * 0.4) : Math.max(5, wait * 0.3) * (1 + Math.min(age, 120) / 60);
  else if (i.type === 'pass') s = Math.max(4, wait * 0.4);
  else if (i.type === 'meal') s = 3 + i.dur * 0.2;
  else s = 3; // イベント・休憩は切り上げられる
  return Math.sqrt(s * s + 2 * 2); // 移動のぶれ（2分）も足す
}
const pct = (p) => Math.min(99, Math.max(1, Math.round(p * 100)));
// 上位3つに、合計100%になるよう「おすすめ度」を配る
function shares(list) {
  const top = list.slice(0, 3);
  if (!top.length) return top;
  const m = Math.max(...top.map((x) => x.score));
  const e = top.map((x) => Math.exp((x.score - m) / 12));
  const sum = e.reduce((a, b) => a + b, 0);
  top.forEach((x, n) => { x.share = Math.max(1, Math.round((e[n] / sum) * 100)); });
  top[0].share += 100 - top.reduce((a, x) => a + x.share, 0); // 合計をちょうど100%に（端数は1位で調整）
  return top;
}
const eligible = (env, done) => env.items.filter((i) => !done.has(i.id) && !env.paused.has(i.id) && !(S.tired && i.pri === 1));

// 時間指定に向けて出発する時刻 ＝ 時刻 − 移動 − 余裕5分（画面のどこでもこの1つの時刻を使う）
const BUF = 5;
const departAt = (f, area) => f.time - travel(area, f.i.area) - BUF;

// 時刻 t・場所 area から「次にすること」を1つ決める。pick：利用者が「ちがうのにする」で選んだもの
function plan(t, area, done, env, pick) {
  const end = env.c.end;
  const pool = eligible(env, done);
  const fixed = pool.filter((i) => i.type === 'fixed').map((i) => ({ i, time: fixedTime(i) }))
    .filter((f) => t <= f.time + 15).sort((a, b) => a.time - b.time);
  const nf = fixed[0] || null;
  if (nf && t >= departAt(nf, area) && !(pick && pick !== nf.i.id)) {
    const tr = travel(area, nf.i.area);
    const start = Math.max(t + tr, nf.time);
    const ok = phi((nf.time - (t + tr)) / 2.5); // 移動のぶれだけ
    return { kind: 'fixed', item: nf.i, time: nf.time, travel: tr, depart: departAt(nf, area), start, finish: start + nf.i.dur, nf, ok };
  }
  // まだ食べていない食事。ほかのものに並んで、食事が締め切りに間に合わなくなるなら選ばない
  const meals = pool.filter((m) => m.type === 'meal' && toMin(m.by) > t && Math.max(t, toMin(m.after)) + +S.same + m.dur <= toMin(m.by));
  const cands = []; let next = null;
  for (const i of pool) {
    if (i.type === 'fixed') continue;
    const tr = travel(area, i.area);
    // 開園直後は、まだ待ち時間データが届かないことが多い。最初に行くものは 10/11 の実績（開園時15分）に近い数字で見積もる
    const openRush = i.first === env.c.dayKey && t < env.c.start + 30;
    const wait = openRush && env.w[i.id].src === '目安' ? i.firstWait : env.w[i.id].wait;
    const cost = tr + wait + i.dur;
    // 空き時間の終わり ＝ 時間指定に向けて出発する時刻
    const limit = nf ? nf.time - travel(i.area || area, nf.i.area) - BUF : end;
    if (i.after && t + tr < toMin(i.after)) {
      const a = toMin(i.after);
      if (a + wait + i.dur <= limit && (!next || a - tr < next.at)) next = { at: a - tr, item: i };
      continue;
    }
    const finish = t + cost;
    if (finish > limit && i.id !== pick) continue;
    if (i.type !== 'meal' && i.id !== pick && meals.some((m) => Math.max(finish, toMin(m.after)) + +S.same + m.dur > toMin(m.by))) continue;
    // 間に合う確率：本当の締め切り（時間指定の時刻 − 移動）までに終わる見込み
    const src = env.w[i.id].src;
    const deadline = nf ? nf.time - travel(i.area || area, nf.i.area) : end;
    const ok = phi((deadline - finish) / spread(i, wait, src, env.age));
    let score = (i.pri || 1) * 60 + ((i.est ?? wait) - wait) * 0.8 - cost * 0.5;
    if (i.type === 'pass') score += 25;
    if (i.type === 'meal' && toMin(i.by) - finish <= 30) score += 80; // 食べ終わる時刻が締め切りの30分前を過ぎるなら急ぐ
    if (openRush) score += 500; // 開園直後にまっすぐ行くもの
    if (i.id === pick) score += 10000;
    score -= (1 - ok) * 60; // 間に合わない危なさの分だけ下げる
    cands.push({ item: i, travel: tr, wait, cost, finish, score, src, ok });
  }
  cands.sort((a, b) => b.score - a.score);
  if (cands.length) { const top = shares(cands.filter((x) => x.item.id !== pick)); const me = cands[0].item.id === pick || !top.length ? cands[0] : top[0];
    return Object.assign({ kind: 'go', alts: cands.filter((x) => x !== me).slice(0, 3), nf, picked: me.item.id === pick }, me); }
  if (next && next.at < end && (!nf || next.at < departAt(nf, area))) return { kind: 'wait', until: next.at, item: next.item, nf };
  if (nf) return { kind: 'move', item: nf.i, nf, depart: departAt(nf, area) };
  return { kind: 'end' };
}

// 今の待ち時間が続くとして、退園までを予測（1つ終わるごとに S.gap 分の余裕をとる）
function simulate(env, t0) {
  const end = env.c.end;
  let t = t0, area = env.area;
  const done = new Set(env.done), tl = [];
  for (let k = 0; k < 80 && t < end; k++) {
    const r = plan(t, area, done, env, k === 0 ? env.chosen : null);
    if (r.kind === 'fixed') tl.push({ from: t, to: r.finish, item: r.item, at: r.time, depart: Math.min(t, r.depart) });
    else if (r.kind === 'go') tl.push({ from: t, to: r.finish, item: r.item, wait: r.wait });
    else if (r.kind === 'wait' || r.kind === 'move') {
      const nt = Math.max(t + 1, r.kind === 'wait' ? r.until : r.depart);
      if (nt - t >= 5) tl.push({ from: t, to: nt, free: true });
      t = nt; continue;
    } else break;
    t = r.finish + (+S.gap || 0);
    done.add(r.item.id);
    if (r.item.area) area = r.item.area;
  }
  const left = eligible(env, done).filter((i) => !(i.type === 'fixed' && fixedTime(i) + 15 < t0));
  return { tl, left, done };
}

function reasonOf(r, env) {
  const i = r.item, p = [];
  if (r.picked) p.push('あなたが選んだもの');
  else if (i.first === env.c.dayKey && r.finish - r.cost < env.c.start + 30) p.push('開園直後がいちばん空く（10/11は開園時15分→20分後110分）');
  else if (i.type === 'pass') p.push('エクスプレス・パスで短い待ち');
  else if (i.type === 'meal') p.push(toMin(i.by) - r.finish < 0 ? `${i.by}の目標を過ぎそう。早めに食事` : `${i.by}までに食事`);
  else if (i.type === 'event') p.push(`${i.after}から開催中`);
  else if (i.type === 'rest') p.push('空き時間に');
  else if (r.src === '目安') p.push('待ちは目安で計算');
  else {
    const d = i.est - r.wait;
    if (d >= 5) p.push(`目安より${d}分短い`);
    else if (d <= -5) p.push(`目安より${-d}分長いが、今入れる中ではいちばん良い`);
    else p.push('待ちは目安どおり');
  }
  p.push(r.nf ? `${fmt(r.nf.time)}の${short(r.nf.i)}に間に合う` : `${env.c.day.end}の退園までに終わる`);
  return p.join('。');
}

/* ============ 画面 ============ */
const $ = (id) => document.getElementById(id);
let lastEnv = null, lastCtx = null;

function render() {
  const c = getCtx();
  const env = buildEnv(c);
  lastEnv = env; lastCtx = c;
  const t = Math.max(c.now, c.start);
  const name = (i) => esc(i.chip || short(i));

  // いちばん上：日付と時刻。更新時刻は古いときだけ目立たせる
  $('clock').innerHTML = `<b>${c.day.label} ${fmt(c.now)}</b>`;
  if (W.updatedAt) {
    const ago = Math.max(0, Math.round((Date.now() - W.updatedAt) / 60000));
    $('fresh').textContent = ago >= 20 ? `⚠ 待ち時間が${dur(ago)}前のまま` : `自動更新：${jstHM(W.updatedAt)}時点（${ago < 1 ? 'たった今' : dur(ago) + '前'}）`;
    $('fresh').className = ago >= 20 ? 'old' : '';
  } else { $('fresh').textContent = '⚠ 待ち時間データなし'; $('fresh').className = 'old'; }
  $('trial').innerHTML = c.trial
    ? `<span>お試し表示（待ちは${S.trialLive ? '今の数字' : '目安'}で計算）</span><button data-act="trialLive">${S.trialLive ? '目安で試す' : '今の待ちで試す'}</button>` : '';
  $('src').textContent = `${W.source ? `データ：${W.source}・` : ''}版 ${APP_VERSION}`;

  // 時間指定を15分過ぎても「済」でないもの
  const overdue = c.now >= c.end ? [] : env.items.filter((i) => i.type === 'fixed' && !env.done.has(i.id) && !env.paused.has(i.id) && c.now > fixedTime(i) + 15);
  $('overdue').innerHTML = overdue.map((i) => `
    <div class="ask"><p>${esc(i.name)}（${fmt(fixedTime(i))}）は済んだ？</p>
    <div class="row2"><button class="btn primary" data-act="done" data-id="${i.id}">済にする</button>
    <button class="btn" data-act="skip" data-id="${i.id}">あきらめる</button></div></div>`).join('');

  // いま
  const r = c.now >= c.end ? { kind: 'end' } : plan(t, env.area, env.done, env, env.chosen);
  const isRide = (x) => x.type === 'standby' || x.type === 'pass';
  const risk = (ok, what) => ok < 0.8 ? `<p class="risk">⚠ ${what}に間に合わないかも</p>` : '';
  const lead = c.now < c.start ? `開園したら（${fmt(c.start)}ごろ）まっすぐ` : 'いま';
  let h = '';
  if (r.kind === 'go') {
    const i = r.item;
    const tag = i.type === 'pass' ? '<span class="tag pass">パス</span>' : '';
    const what = isRide(i) ? `待ち${r.wait}分` : `${i.dur}分くらい`;
    h = `<p class="lead">${lead}</p><h2>${tag}${esc(i.name)}</h2>
      <p class="facts">${what}<span class="dot">・</span><b>${fmt(r.finish)}</b>ごろ終わる</p>
      <p class="why">${esc(reasonOf(r, env))}</p>
      ${risk(r.ok, r.nf ? `${fmt(r.nf.time)}の${name(r.nf.i)}` : '退園')}
      <button class="big" data-act="done" data-id="${i.id}">終わった</button>
      ${r.picked ? `<button class="link" data-act="unpick">おすすめに戻す</button>` : r.alts.length ? `<button class="link" data-act="alts">${showAlts ? 'ほかの候補を閉じる' : 'ちがうのにする ›'}</button>` : ''}
      ${showAlts && !r.picked ? `<ul class="alts">${r.alts.map((a) => `<li><span class="an">${name(a.item)}<small>${isRide(a.item) ? `待ち${a.wait}分・` : ''}${fmt(a.finish)}ごろ終わる${a.share >= 5 ? `・おすすめ度${a.share}%` : ''}</small></span>
        <button data-act="pick" data-id="${a.item.id}">これにする</button></li>`).join('')}</ul>` : ''}`;
  } else if (r.kind === 'fixed') {
    const late = t > r.time, go = t >= r.depart;
    h = `<p class="lead">${lead}<span class="tag fixed">🔒 時間指定</span></p><h2>${esc(r.item.name)}</h2>
      <p class="facts"><b>${fmt(r.time)}</b>から<span class="dot">・</span>移動${r.travel}分</p>
      <p class="why ${go ? 'hot' : ''}">${late ? '時刻を過ぎています。急いで！' : go ? '今すぐ出発！' : `${fmt(r.depart)}に出発`}</p>
      <button class="big" data-act="done" data-id="${r.item.id}">終わった</button>`;
  } else if (r.kind === 'move') {
    h = `<p class="lead">${lead}</p><h2>休憩・写真</h2>
      <p class="facts"><b>${fmt(r.depart)}</b>まで</p>
      <p class="why">今から並ぶと、上の時間指定に間に合いません。</p>`;
  } else if (r.kind === 'wait') {
    h = `<p class="lead">${lead}</p><h2>休憩・写真</h2>
      <p class="facts"><b>${fmt(r.until)}</b>に動き出す → ${name(r.item)}（${r.item.after}から）</p>`;
  } else {
    h = `<p class="lead">${c.now >= c.end ? '退園時刻です' : '今日の予定はここまで'}</p><h2>出口へ</h2><p class="why">${esc(c.day.endText)}</p>`;
  }
  $('now').innerHTML = h;

  // いちばん上：時間指定の帯。次の時間指定を大きく、このあとの分を小さく。出発の15分前から赤
  const upcoming = env.items.filter((i) => i.type === 'fixed' && !env.done.has(i.id) && !env.paused.has(i.id) && fixedTime(i) + 15 >= c.now)
    .sort((a, b) => fixedTime(a) - fixedTime(b));
  // 「いま」がその時間指定そのものなら、帯にはその次を出す
  const list = r.kind === 'fixed' ? upcoming.filter((i) => i !== r.item) : upcoming;
  const nf = list[0];
  let bar = '';
  if (c.now >= c.end) bar = '';
  else if (nf) {
    const f = { i: nf, time: fixedTime(nf) };
    const from = r.kind === 'fixed' ? r.item.area : env.area;
    const dep = departAt(f, from);
    const hot = r.kind !== 'fixed' && c.now >= dep - 15;
    const rest = list.slice(1).map((i) => `<span>${fmt(fixedTime(i))} ${name(i)}</span>`).join('');
    bar = `<div class="fixbar ${hot ? 'hot' : ''}">
      <div class="fb1"><span class="fbt">🔒 ${fmt(f.time)}</span><span class="fbn">${name(nf)}</span></div>
      <div class="fb2">${r.kind === 'fixed' ? `${esc(short(r.item))}のあと、${fmt(dep)}に出発` : c.now >= dep ? '今すぐ出発！' : `${fmt(dep)}に出発（あと${dur(dep - c.now)}）`}</div>
      ${rest ? `<div class="fb3"><i>このあと</i>${rest}</div>` : ''}</div>`;
  } else if (upcoming.length === 0) {
    bar = `<div class="fixbar"><div class="fb2">今日の時間指定はすべて終わり。${esc(c.day.endText)}</div></div>`;
  }
  $('alert').innerHTML = bar;
  if (!notify.on && !c.trial) $('alert').innerHTML += `<button class="link" data-act="notify">🔔 時間指定の前に音で知らせる</button>`;

  renderList(env);
  renderPlan(env, t, r);
  renderRules(env);
  renderNotify();
  checkAlarms(c, env);
}

function renderList(env) {
  const rows = [...env.items].sort((a, b) => {
    const ta = a.type === 'fixed' ? fixedTime(a) : a.after ? toMin(a.after) : 0;
    const tb = b.type === 'fixed' ? fixedTime(b) : b.after ? toMin(b.after) : 0;
    return (env.done.has(a.id) - env.done.has(b.id)) || (ta - tb);
  });
  $('list').innerHTML = `<div class="note">「直す」で待ち時間を手入力できます（新しい自動データが来たら自動に戻ります）。</div>` + rows.map((i) => {
    const st = env.st.status[i.id];
    const p = env.paused.get(i.id);

    else meta.push(`<span class="tag ${i.type === 'pass' ? 'pass' : ''}">${TYPE_LABEL[i.type]}</span>`);
    if (ride) { const w = env.w[i.id]; meta.push(`待ち <b>${w.wait}分</b>（${w.src}）`); }
    if (i.est != null) meta.push(`目安${i.est}分`);
    if (i.after) meta.push(`${i.after}以降`);
    if (i.by) meta.push(`${i.by}までに`);
    if (i.pri) meta.push(`優先${PRI_LABEL[i.pri]}`);
    if (i.days.length === 2) meta.push('両日');
    const status = st === 'done' ? '<span class="tag ok">済</span>' : st === 'skip' ? '<span class="tag">あきらめ</span>' : p ? `<span class="tag fixed">休止中${p === 'auto' ? '（自動）' : ''}</span>` : '';
    const acts = [];
    if (st) acts.push(`<button class="btn small" data-act="undo" data-id="${i.id}">戻す</button>`);
    else acts.push(`<button class="btn small" data-act="done" data-id="${i.id}">済</button>`);

  }).join('');
}

/// 入らない「優先の高いもの」があるとき、優先の低い予定を1つ削れば入るかを計算し直す
function suggestCuts(env, t0, sim) {
  const out = [];
  const want = sim.left.filter((i) => i.type !== 'fixed' && i.pri).sort((a, b) => b.pri - a.pri);
  const planned = sim.tl.filter((x) => x.item && x.item.type !== 'fixed' && x.item.pri).map((x) => x.item);
  for (const w of want) {
    const cuts = planned.filter((p) => p.pri < w.pri && !out.some((o) => o.cut === p)).sort((a, b) => a.pri - b.pri);
    for (const p of cuts) {
      const sim2 = simulate(Object.assign({}, env, { done: new Set([...env.done, p.id]) }), t0);
      if (sim2.tl.some((x) => x.item && x.item.id === w.id)) { out.push({ cut: p, gain: w }); break; }
    }
    if (out.length >= 2) break;
  }
  return out;
}

// 「このあと」：今日の残りを、乗り換え案内のように上から並べる
function renderPlan(env, t0, now) {
  const name = (i) => esc(i.chip || short(i));
  if (lastCtx.now >= env.c.end) { $('plan').innerHTML = ''; return; }
  const sim = simulate(env, t0);
  // 先頭は「いま」のカードと同じなので省く
  const rows = sim.tl.slice(now.kind === 'end' ? 0 : 1).filter((x) => !x.free || x.to - x.from >= 10);
  let left = sim.left, moved = [], cuts = suggestCuts(env, t0, sim);
  if (env.c.dayKey === 'd4') { // 11/4 は 11/5 まで続けて計算する（両日のものは 11/5 に回せるため）
    moved = sim.left.filter((i) => i.days.includes('d5'));
    const d5 = DAYS.d5;
    const c5 = Object.assign({}, env.c, { dayKey: 'd5', day: d5, start: toMin(d5.open || d5.start), end: toMin(d5.end) });
    const env5 = buildEnv(c5, true);
    env5.done = new Set([...sim.done]); env5.area = d5.startArea; env5.chosen = null;
    const sim5 = simulate(env5, c5.start);
    left = [...sim.left.filter((i) => !i.days.includes('d5')), ...sim5.left];
    cuts = [...cuts.filter((x) => !x.gain.days.includes('d5')), ...suggestCuts(env5, c5.start, sim5)].slice(0, 2);
  }
  const li = rows.map((x) => x.free
    ? `<li class="free"><time>${fmt(x.from)}</time><span>休憩・写真</span></li>`

    : `<p class="verdict good">✅ この流れなら${span}全部回れる</p>`;
  $('plan').innerHTML = `<h3>このあと</h3><ol class="tl2">${li}
      <li class="end"><time>${env.c.day.end}</time><span>${esc(env.c.day.endText.replace(/^\d+:\d+\s*/, ''))}</span></li></ol>
    ${verdict}

    <p class="note">${env.useEst ? '目安の待ち時間で計算しています。' : '今の待ち時間が続くとして計算しています。'}1つ終わるごとに${S.gap}分の余裕をみています。</p>`;
}

function mutate(fn) {

document.addEventListener('click', (e) => {

  const id = b.dataset.id, act = b.dataset.act;
  const item = ITEMS.find((i) => i.id === id);
  if (act === 'done' || act === 'skip') {
    showAlts = false;

      st.status[id] = act; st.at[id] = Date.now();
      if (st.chosen === id) st.chosen = null;

    mutate((st) => { st.chosen = null; });
  } else if (act === 'undo') {
    mutate((st) => { delete st.status[id]; delete st.at[id]; });
  } else if (act === 'pause') {

    if (v === null) return;
    mutate((st) => {
      const n = parseInt(v.replace(/[０-９]/g, (d) => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)), 10);
      if (v.trim() === '' || isNaN(n)) delete st.overrides[id];
      else st.overrides[id] = { wait: Math.max(0, n), at: Date.now() };

    S.trialLive = !S.trialLive; saveS(); render();

});

/* ============ お知らせ（音・画面いっぱい・画面オフ防止） ============ */
const notify = { on: false, wanted: LS.get(K.notify, false), ctx: null, lock: null };
function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
  try {
    notify.ctx = notify.ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (notify.ctx.state !== 'running') notify.ctx.resume();
    const src = notify.ctx.createBufferSource(); // 無音を1回鳴らして iPhone の制限を解除
    src.buffer = notify.ctx.createBuffer(1, 1, 22050); src.connect(notify.ctx.destination); src.start(0);
    return true;
  } catch { return false; }
}
function beep(times = 3) {
  const a = notify.ctx;
  if (a) {
    try {
      if (a.state !== 'running') a.resume();
      const t0 = a.currentTime + 0.05;
      for (let k = 0; k < times; k++) for (const [f, dt] of [[880, 0], [1320, 0.2]]) {
        const o = a.createOscillator(), g = a.createGain(), s = t0 + k * 0.8 + dt;
        o.type = 'square'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.35, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.18);
        o.connect(g).connect(a.destination); o.start(s); o.stop(s + 0.2);
      }
    } catch {}
  }
  try { navigator.vibrate && navigator.vibrate([400, 200, 400, 200, 400]); } catch {}
}
async function keepAwake() {
  if (!notify.on || !('wakeLock' in navigator) || document.visibilityState !== 'visible' || notify.lock) return;
  try {
    notify.lock = await navigator.wakeLock.request('screen');
    notify.lock.addEventListener('release', () => { notify.lock = null; renderNotify(); });
  } catch {}
  renderNotify();
}
function enableNotify() {
  notify.on = unlockAudio();
  notify.wanted = true; LS.set(K.notify, true);
  beep(1);
  keepAwake();
  render();
}
function disableNotify() {
  notify.on = false; notify.wanted = false; LS.set(K.notify, false);
  if (notify.lock) { notify.lock.release().catch(() => {}); notify.lock = null; }
  render();
}
// 前に「オン」にしていたら、画面のどこかを最初にタップしたときに自動で再開する
document.addEventListener('pointerdown', () => { if (notify.wanted && !notify.on) { notify.on = unlockAudio(); keepAwake(); renderNotify(); } }, true);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { keepAwake(); refresh(); }
});

function checkAlarms(c, env) {
  if (c.trial) return; // お試し表示中は鳴らさない
  const fired = LS.get(K.fired, {});
  const now = c.real.min;
  for (const i of env.items) {
    if (i.type !== 'fixed' || env.done.has(i.id) || env.paused.has(i.id)) continue;
    const ft = fixedTime(i);
    for (const [off, until] of [[20, 10], [10, 0]]) {
      const key = `${c.day.date}|${i.id}|${S.times[i.id] || i.time}|${off}`;
      if (!fired[key] && now >= ft - off && now < ft - until) {
        fired[key] = Date.now(); LS.set(K.fired, fired);
        showAlarm(`${short(i)} ${fmt(ft)}（あと${dur(ft - now)}）／移動${travel(env.area, i.area)}分`);
        return;
      }
    }
  }
}

/* ============ カレンダー（.ics） ============ */
function icsText(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
function icsFold(line) { // 75バイトごとに折り返す（日本語対応）
  const enc = new TextEncoder(); let out = '', cur = '', bytes = 0;
  for (const ch of line) {
    const b = enc.encode(ch).length;
    if (bytes + b > (out ? 74 : 75)) { out += (out ? '\r\n ' : '') + cur; cur = ''; bytes = 0; }
    cur += ch; bytes += b;
  }
  return out ? out + '\r\n ' + cur : cur;
}
function icsUTC(date, min) { // 日本時間 → UTC表記
  const [y, m, d] = date.split('-').map(Number);
  const t = new Date(Date.UTC(y, m - 1, d, 0, min) - 9 * 3600e3);
  return t.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
}
function buildICS() {
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//usj-navi//JA', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:USJナビ', 'X-WR-TIMEZONE:Asia/Tokyo'];
  const stamp = icsUTC('2026-10-01', 0);
  const ev = (uid, date, start, len, title, desc) => {
    L.push('BEGIN:VEVENT', `UID:${uid}@usj-navi`, `DTSTAMP:${stamp}`, `DTSTART:${icsUTC(date, start)}`, `DTEND:${icsUTC(date, start + len)}`,
      `SUMMARY:${icsText(title)}`, `DESCRIPTION:${icsText(desc)}`, `LOCATION:${icsText('ユニバーサル・スタジオ・ジャパン')}`);
    for (const m of [20, 5]) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsText(`${m}分後：${title}`)}`, `TRIGGER:-PT${m}M`, 'END:VALARM');
    L.push('END:VEVENT');
  };
  for (const day of Object.values(DAYS)) {
    for (const i of ITEMS.filter((x) => x.type === 'fixed' && x.days.includes(day.key))) {
      const t = fixedTime(i);
      ev(`${i.id}-${day.date}`, day.date, t, i.dur, `【USJ】${i.name}`, `時間指定 ${fmt(t)}。遅れないように早めに移動。`);
    }
    ev(`exit-${day.date}`, day.date, toMin(day.end), 15, '【USJ】退園（出口へ）', day.endText);
  }
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}
function downloadICS() {
  const ics = buildICS();
  const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const changed = Object.keys(S.times).some((k) => S.times[k] && S.times[k] !== ITEMS.find((i) => i.id === k).time);
  if (ios) {
    // 時刻を変えていなければ、公開済みのファイルを開く（iPhone で一番確実）
    location.href = changed ? 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics) : './usj-navi.ics';
    return;
  }
  const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = 'usj-navi.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

  $('sTired').onchange = (e) => upd(() => { S.tired = e.target.checked; });
  $('sDay').onchange = (e) => upd(() => { S.day = e.target.value; });
  $('sTime').onchange = (e) => upd(() => { S.fixTime = e.target.value; });
  $('sTimeClear').onclick = () => { $('sTime').value = ''; upd(() => { S.fixTime = ''; }); };
  $('sSame').onchange = (e) => upd(() => { S.same = Math.max(0, +e.target.value || 0); });
  $('sPace').value = String(S.pace || 1);
  $('sPace').onchange = (e) => upd(() => { S.pace = +e.target.value || 1; });
  for (const inp of document.querySelectorAll('[data-time]')) inp.onchange = (e) => upd(() => { if (e.target.value) S.times[e.target.dataset.time] = e.target.value; });
  $('sResetTrial').onclick = () => { if (confirm('お試しの記録を消しますか？')) { LS.del(K.trial); render(); } };
  $('sResetReal').onclick = () => { if (confirm('本番の記録（済・休止・手入力）を消しますか？\n元に戻せません。')) { LS.del(K.state); render(); } };
}

/* ============ 開始 ============ */
const cached = LS.get(K.data, null);
if (cached) W = Object.assign(cached, { source: '保存データ' });
renderSettings();
render();
refresh();
setInterval(refresh, 3 * 60 * 1000); // 開いている間は3分おきに再取得
setInterval(render, 20 * 1000);
</script>
</body>
